name: Обновить статистику профиля

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==12.2.0'
      - name: Нарисовать карточки по публичным данным GitHub
        run: python -B scripts/render_profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Опубликовать обновление
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/stats*.png assets/activity*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Обновить карточки статистики'
          fi
          revision="$(git log -1 --format=%H -- assets/stats*.png assets/activity*.png)"
          sed -i "/<!-- profile-stats:start -->/,/<!-- profile-stats:end -->/s|/main/assets/|/$revision/assets/|g" README.md
          git add -- README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Опубликовать статистику профиля'
          fi
          git pull --no-rebase --no-edit origin main
          git push origin HEAD:main
